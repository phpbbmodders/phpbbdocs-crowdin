# ==============================================================================
# Shared phpBB Documentation Crowdin Configuration
# ==============================================================================
#
# Applies to every docs project this tool targets.
#
# Project identity comes from the docs repository's own git remote (or
# directory name, with no remote), optionally overridden by a
# docs-project.conf file in the docs repository root.
#
# Target languages are discovered from the docs repository itself (its
# existing content/<lang>/ directories), not a fixed universal list —
# see README.md for why this differs from phpbb-crowdin's approach.
# ==============================================================================

SOURCE_LANGUAGE=en

SOURCE_SYNC=true

CROWDIN_CLI_TEMPLATE=crowdin.yml.template

# Optional global settings:
#
# PROJECT_VISIBILITY=open
# LANGUAGE_ACCESS_POLICY=open
