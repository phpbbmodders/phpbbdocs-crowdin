name: Bug Report
description: Report a problem with crowdin-init.sh or the crowdin.yml template/fragments.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command run and relevant output
      description: Include the exact crowdin-init.sh invocation and its output (redact any tokens).
      render: shell
    validations:
      required: true

  - type: input
    id: docs-project
    attributes:
      label: Docs project
      description: Which docs project (e.g. phpbbdocs-hugo) and does it match this tool's DocBook-XML convention?
    validations:
      required: false

  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `crowdin --version`, `bash --version`, and OS.
    validations:
      required: false
